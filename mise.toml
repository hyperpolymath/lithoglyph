[tools]
# Language runtimes
rust = "latest"
# Pinned, not "latest". The workflows pin 0.15.2 and src/bridge.zig uses
# 0.15-era APIs; "latest" resolves to 0.16.0 locally, where std.fs.cwd() is gone
# and a local `zig build test` fails in ways CI never sees. A local toolchain
# that disagrees with CI turns every build into a guess about which one is right.
zig = "0.15.2"
bun = "latest"
denojs = "latest"

# Package managers
pnpm = "latest"
cargo = "latest"
go-task = "latest"

# Formatting & Linting
shfmt = "latest"
stylua = "latest"

# Build tools
cmake = "latest"
ninja = "latest"

# Shell tools
git = "latest"
gnu-sed = "latest"
gnu-tar = "latest"
gnu-grep = "latest"

# Testing

[env]
# Common environment variables

# Task runner alias
[alias]
task = "go-task"
build = "cargo build --release"
test = "cargo test"
lint = "bun install --frozen-lockfile && bunx --no-install --bun prettier --check ."
fmt = "bun install --frozen-lockfile && bunx --no-install --bun prettier --write ."
